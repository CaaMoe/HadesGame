name: Java CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7.0.1

      - name: Setup JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Output
          path: build/libs/*.jar
          retention-days: 15
